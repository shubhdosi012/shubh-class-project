name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Format source files on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bunx prettier --write "src/**/*.{ts,tsx,css,json}"

      - name: Commit formatting fixes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src
          if ! git diff --cached --quiet; then
            git commit -m "chore: format portfolio source files"
            git push
          else
            echo "No formatting changes required."
          fi

      - name: Check formatting on pull requests
        if: github.event_name == 'pull_request'
        run: bunx prettier --check "src/**/*.{ts,tsx,css,json}"

      - name: Run ESLint
        run: bun run lint

      - name: Build production app
        if: always() && steps.install.outcome == 'success'
        run: bun run build
